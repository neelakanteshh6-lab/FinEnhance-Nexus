<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinEnhance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch-page">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
