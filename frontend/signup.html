<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FinEnhance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Start your FinEnhance journey
            </p>

            <form id="signupForm">

                <div class="name-row">

                    <div>
                        <label>First Name</label>
                        <input
                            type="text"
                            id="first_name"
                            placeholder="First name"
                            required
                        >
                    </div>

                    <div>
                        <label>Last Name</label>
                        <input
                            type="text"
                            id="last_name"
                            placeholder="Last name"
                            required
                        >
                    </div>

                </div>

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    SIGN UP
                </button>

            </form>

            <p id="signupMessage"></p>

            <p class="switch-page">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/signup.js"></script>

</body>
</html>
